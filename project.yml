name: Pepline
options:
  bundleIdPrefix: com.awdia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # 5.10+ is the floor for the purchase APIs used (RepLock).
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.80.0
  # Anonymous product analytics (no ATT, no identifiers).
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    # Kept in sync with CFBundleShortVersionString below (the value that ships).
    MARKETING_VERSION: 1.0.0

targets:
  Pepline:
    type: application
    platform: iOS
    sources:
      - Pepline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awdia.pepline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Pepline/Pepline.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: TelemetryDeck
        product: TelemetryDeck
    info:
      path: Pepline/Info.plist
      properties:
        CFBundleDisplayName: Pepline
        # Explicit — XcodeGen defaults this to a literal "1.0" and does NOT wire
        # it to MARKETING_VERSION. Every new release train must bump it.
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        # Localized in InfoPlist.xcstrings.
        NSHealthShareUsageDescription: Pepline reads your weight from Apple Health to draw your progress curve.
        NSHealthUpdateUsageDescription: Pepline saves the weights you log to Apple Health.
        NSCameraUsageDescription: Pepline uses the camera for your progress photos and to scan food barcodes.
        ITSAppUsesNonExemptEncryption: false
        # iPhone-only portrait app: opting out of iPad multitasking satisfies
        # App Store validation without declaring all four orientations.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PeplineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeplineTests
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pepline.app/Pepline
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Pepline

schemes:
  Pepline:
    build:
      targets:
        Pepline: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - Pepline
      targets:
        - PeplineTests
