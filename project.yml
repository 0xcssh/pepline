name: Pepline
options:
  bundleIdPrefix: com.awdia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    # Kept in sync with CFBundleShortVersionString below (the value that ships).
    MARKETING_VERSION: 1.0.0

targets:
  Pepline:
    type: application
    platform: iOS
    sources:
      - Pepline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awdia.pepline
    info:
      path: Pepline/Info.plist
      properties:
        CFBundleDisplayName: Pepline
        # Explicit — XcodeGen defaults this to a literal "1.0" and does NOT wire
        # it to MARKETING_VERSION. Every new release train must bump it.
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # iPhone-only portrait app: opting out of iPad multitasking satisfies
        # App Store validation without declaring all four orientations.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PeplineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeplineTests
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pepline.app/Pepline
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Pepline

schemes:
  Pepline:
    build:
      targets:
        Pepline: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - Pepline
      targets:
        - PeplineTests
